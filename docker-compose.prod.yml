# Production configuration
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d

services:
  # Nginx Reverse Proxy & Load Balancer
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api-service-1
      - api-service-2
      - websocket-service
      - frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - casino-network
    restart: unless-stopped

  # API Service Instance 1
  api-service-1:
    build:
      context: ./backend/api-service
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-casino_db}
      - DB_USER=${DB_USER:-casino_user}
      - DB_PASSWORD=${DB_PASSWORD:-casino_password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-your-refresh-secret-key-change-in-production}
      - WALLET_SERVICE_URL=http://wallet-service:3003
      - GAME_ENGINE_URL=http://game-engine:3002
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - casino-network
    restart: unless-stopped

  # API Service Instance 2 (Load Balanced)
  api-service-2:
    build:
      context: ./backend/api-service
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-casino_db}
      - DB_USER=${DB_USER:-casino_user}
      - DB_PASSWORD=${DB_PASSWORD:-casino_password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-your-refresh-secret-key-change-in-production}
      - WALLET_SERVICE_URL=http://wallet-service:3003
      - GAME_ENGINE_URL=http://game-engine:3002
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - casino-network
    restart: unless-stopped

  # WebSocket Service
  websocket-service:
    build:
      context: ./backend/websocket-service
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3001
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - GAME_ENGINE_URL=http://game-engine:3002
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - casino-network
    restart: unless-stopped

  # Game Engine Service
  game-engine:
    build:
      context: ./backend/game-engine
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3002
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WALLET_SERVICE_URL=http://wallet-service:3003
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - casino-network
    restart: unless-stopped

  # Wallet Service
  wallet-service:
    build:
      context: ./backend/wallet-service
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3003
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-casino_db}
      - DB_USER=${DB_USER:-casino_user}
      - DB_PASSWORD=${DB_PASSWORD:-casino_password}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - casino-network
    restart: unless-stopped

  # Frontend (Production Build with Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - casino-network
    restart: unless-stopped
